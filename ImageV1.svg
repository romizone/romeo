<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="ivbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1A3C"/>
      <stop offset="100%" style="stop-color:#2c2656"/>
    </linearGradient>
    <linearGradient id="ivsun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFC62E"/>
      <stop offset="100%" style="stop-color:#F5B400"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ivbg)" rx="16"/>

  <!-- window -->
  <rect x="28" y="20" width="344" height="226" rx="10" fill="#EDEFF5"/>
  <rect x="28" y="20" width="344" height="24" rx="10" fill="#FFFFFF"/>
  <rect x="28" y="36" width="344" height="8" fill="#FFFFFF"/>
  <line x1="28" y1="44" x2="372" y2="44" stroke="#D6D9E6" stroke-width="0.8"/>
  <rect x="38" y="26" width="12" height="12" rx="3" fill="#1E1A3C"/>
  <rect x="41" y="29" width="6" height="6" rx="1" fill="none" stroke="#FFC62E" stroke-width="1.1"/>
  <text x="55" y="35.6" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#1E1A3C">Image V.1</text>
  <g font-family="Figtree,Inter,system-ui,Arial,sans-serif" font-size="5.4" font-weight="600" fill="#3A3560">
    <text x="104" y="34.8">Pas foto</text>
    <text x="132" y="34.8">Gaya Korea</text>
    <text x="168" y="34.8">Kompres</text>
    <text x="197" y="34.8">Potong</text>
    <text x="222" y="34.8">Editor foto</text>
    <text x="258" y="34.8">Hapus latar</text>
  </g>
  <rect x="322" y="26" width="42" height="12" rx="6" fill="#FFFFFF" stroke="#1FA774" stroke-opacity=".5" stroke-width="0.8"/>
  <circle cx="330" cy="32" r="2.2" fill="#1FA774"/>
  <text x="335" y="34.2" font-family="Figtree,Inter,system-ui,Arial,sans-serif" font-size="5.4" font-weight="700" fill="#137a53">AI aktif</text>

  <!-- hero -->
  <text x="40" y="66" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="800" fill="#1E1A3C" letter-spacing="-0.4">Semua alat untuk</text>
  <text x="40" y="82" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="800" fill="#1E1A3C" letter-spacing="-0.4">mengolah gambar.</text>
  <text x="40" y="93" font-family="Figtree,Inter,system-ui,Arial,sans-serif" font-size="5.2" fill="#3A3560">File diproses di perangkat Anda. Hanya fitur AI yang mengirim gambar ke GPU server.</text>

  <!-- category tabs -->
  <g font-family="Figtree,Inter,system-ui,Arial,sans-serif" font-size="5" font-weight="600">
    <rect x="40" y="99" width="24" height="10" rx="5" fill="#1E1A3C"/><text x="52" y="105.8" fill="#fff" text-anchor="middle">Semua</text>
    <rect x="67" y="99" width="30" height="10" rx="5" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/><text x="82" y="105.8" fill="#1E1A3C" text-anchor="middle">Optimasi</text>
    <rect x="100" y="99" width="20" height="10" rx="5" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/><text x="110" y="105.8" fill="#1E1A3C" text-anchor="middle">Buat</text>
    <rect x="123" y="99" width="20" height="10" rx="5" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/><text x="133" y="105.8" fill="#1E1A3C" text-anchor="middle">Ubah</text>
    <rect x="146" y="99" width="30" height="10" rx="5" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/><text x="161" y="105.8" fill="#1E1A3C" text-anchor="middle">Konversi</text>
    <rect x="179" y="99" width="32" height="10" rx="5" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/><text x="195" y="105.8" fill="#1E1A3C" text-anchor="middle">Keamanan</text>
  </g>

  <!-- tool cards: row 1 -->
  <g font-family="Figtree,Inter,system-ui,Arial,sans-serif">
    <rect x="40" y="116" width="102" height="58" rx="7" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/>
    <rect x="48" y="123" width="15" height="15" rx="4" fill="#3B6EF5"/>
    <rect x="52" y="126" width="7" height="9" rx="1" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="55.5" cy="129.5" r="1.6" fill="#fff"/>
    <text x="48" y="150" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="7.2" font-weight="700" fill="#1E1A3C">Pas foto</text>
    <text x="48" y="158" font-size="4.6" fill="#5F6380">2×3 · 3×4 · 4×6 · paspor</text>
    <text x="48" y="165" font-size="4.6" fill="#5F6380">latar merah, biru, putih · 300 DPI</text>

    <rect x="149" y="116" width="102" height="58" rx="7" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/>
    <rect x="157" y="123" width="15" height="15" rx="4" fill="#E0457B"/>
    <circle cx="164.5" cy="130.5" r="4" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="163" cy="129.6" r="0.7" fill="#fff"/><circle cx="166" cy="129.6" r="0.7" fill="#fff"/>
    <rect x="231" y="122" width="14" height="7" rx="3.5" fill="#FFC62E"/><text x="238" y="127.2" font-size="4.4" font-weight="700" fill="#1E1A3C" text-anchor="middle">AI</text>
    <text x="157" y="150" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="7.2" font-weight="700" fill="#1E1A3C">Gaya Korea</text>
    <text x="157" y="158" font-size="4.6" fill="#5F6380">oppa atau K-beauty</text>
    <text x="157" y="165" font-size="4.6" fill="#5F6380">wajah tetap wajah Anda</text>

    <rect x="258" y="116" width="102" height="58" rx="7" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/>
    <rect x="266" y="123" width="15" height="15" rx="4" fill="#1FA774"/>
    <path d="M269.5 126.5 l3 3 M277.5 134.5 l-3 -3 M272.5 127 v2.5 h-2.5 M274.5 134 v-2.5 h2.5" stroke="#fff" stroke-width="1" fill="none" stroke-linecap="round"/>
    <text x="266" y="150" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="7.2" font-weight="700" fill="#1E1A3C">Kompres gambar</text>
    <text x="266" y="158" font-size="4.6" fill="#5F6380">JPG, PNG, WEBP, SVG, GIF</text>
    <text x="266" y="165" font-size="4.6" fill="#5F6380">tidak pernah lebih besar</text>
  </g>

  <!-- tool cards: row 2 -->
  <g font-family="Figtree,Inter,system-ui,Arial,sans-serif">
    <rect x="40" y="180" width="102" height="58" rx="7" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/>
    <rect x="48" y="187" width="15" height="15" rx="4" fill="#1FA774"/>
    <path d="M51 199 l3.5 -4.5 l2.5 3 l2 -2 l2 3.5z" fill="#fff"/>
    <rect x="122" y="186" width="14" height="7" rx="3.5" fill="#FFC62E"/><text x="129" y="191.2" font-size="4.4" font-weight="700" fill="#1E1A3C" text-anchor="middle">AI</text>
    <text x="48" y="214" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="7.2" font-weight="700" fill="#1E1A3C">Hapus latar</text>
    <text x="48" y="222" font-size="4.6" fill="#5F6380">IS-Net di browser (WASM)</text>
    <text x="48" y="229" font-size="4.6" fill="#5F6380">atau layar hijau + chroma key</text>

    <rect x="149" y="180" width="102" height="58" rx="7" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/>
    <rect x="157" y="187" width="15" height="15" rx="4" fill="#7B5BF2"/>
    <ellipse cx="164.5" cy="194.5" rx="3.6" ry="4.5" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="1.4 1"/>
    <rect x="231" y="186" width="14" height="7" rx="3.5" fill="#FFC62E"/><text x="238" y="191.2" font-size="4.4" font-weight="700" fill="#1E1A3C" text-anchor="middle">AI</text>
    <text x="157" y="214" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="7.2" font-weight="700" fill="#1E1A3C">Sensor wajah</text>
    <text x="157" y="222" font-size="4.6" fill="#5F6380">blur · pikselasi · kotak hitam</text>
    <text x="157" y="229" font-size="4.6" fill="#5F6380">plat nomor ditandai AI</text>

    <rect x="258" y="180" width="102" height="58" rx="7" fill="#fff" stroke="#D6D9E6" stroke-width="0.7"/>
    <rect x="266" y="187" width="15" height="15" rx="4" fill="#EE8A12"/>
    <path d="M270.5 191.5 l-2.5 3 l2.5 3 M276.5 191.5 l2.5 3 l-2.5 3" stroke="#fff" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="266" y="214" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="7.2" font-weight="700" fill="#1E1A3C">HTML ke gambar</text>
    <text x="266" y="222" font-size="4.6" fill="#5F6380">kode → html2canvas</text>
    <text x="266" y="229" font-size="4.6" fill="#5F6380">URL → Chromium serverless</text>
  </g>

  <!-- footer strip -->
  <rect x="120" y="256" width="160" height="28" rx="14" fill="url(#ivsun)"/>
  <text x="200" y="274" font-family="Bricolage Grotesque,Inter,system-ui,Arial,sans-serif" font-size="10" font-weight="800" fill="#1E1A3C" text-anchor="middle">16 alat · 8 dengan AI</text>
</svg>
