<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Network grid -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="50" y1="50" x2="350" y2="50"/>
    <line x1="50" y1="100" x2="350" y2="100"/>
    <line x1="50" y1="150" x2="350" y2="150"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="50" y1="250" x2="350" y2="250"/>
    <line x1="100" y1="30" x2="100" y2="270"/>
    <line x1="200" y1="30" x2="200" y2="270"/>
    <line x1="300" y1="30" x2="300" y2="270"/>
  </g>
  <!-- Network nodes -->
  <circle cx="200" cy="120" r="22" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <circle cx="200" cy="120" r="8" fill="#06b6d4"/>
  <circle cx="120" cy="80" r="12" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="120" cy="80" r="4" fill="#06b6d4" opacity="0.7"/>
  <circle cx="280" cy="80" r="12" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="280" cy="80" r="4" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="100" cy="170" r="12" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="100" cy="170" r="4" fill="#10b981" opacity="0.7"/>
  <circle cx="300" cy="170" r="12" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="300" cy="170" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="150" cy="200" r="10" fill="none" stroke="#06b6d4" stroke-width="1"/>
  <circle cx="250" cy="200" r="10" fill="none" stroke="#8b5cf6" stroke-width="1"/>
  <!-- Connection lines -->
  <line x1="200" y1="120" x2="120" y2="80" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="120" x2="280" y2="80" stroke="#8b5cf6" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="120" x2="100" y2="170" stroke="#10b981" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="120" x2="300" y2="170" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="120" x2="150" y2="200" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>
  <line x1="200" y1="120" x2="250" y2="200" stroke="#8b5cf6" stroke-width="0.8" opacity="0.4"/>
  <!-- Scan pulse -->
  <circle cx="200" cy="120" r="35" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.3"/>
  <circle cx="200" cy="120" r="55" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.15"/>
  <!-- Title -->
  <text x="200" y="260" text-anchor="middle" fill="#f8fafc" font-family="SF Pro Display, -apple-system, sans-serif" font-size="24" font-weight="700">NetScope</text>
  <text x="200" y="282" text-anchor="middle" fill="#94a3b8" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11">Native macOS Network Scanner</text>
</svg>
