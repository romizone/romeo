<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="ovbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="100%" style="stop-color:#0b0b10"/>
    </linearGradient>
    <linearGradient id="ovacc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff7a18"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="ovframe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1030"/>
      <stop offset="55%" style="stop-color:#3b1a5c"/>
      <stop offset="100%" style="stop-color:#ff7a18"/>
    </linearGradient>
    <linearGradient id="ovroad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:.9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ovbg)" rx="16"/>

  <!-- window -->
  <rect x="32" y="22" width="336" height="214" rx="9" fill="#0b0b10" stroke="url(#ovacc)" stroke-width="2"/>
  <rect x="32" y="22" width="336" height="22" rx="9" fill="#14141c"/>
  <rect x="32" y="36" width="336" height="8" fill="#14141c"/>
  <rect x="42" y="28" width="11" height="11" rx="3" fill="url(#ovacc)"/>
  <text x="47.5" y="36.5" font-family="Inter,system-ui,Arial,sans-serif" font-size="6.5" font-weight="800" fill="#fff" text-anchor="middle">OR</text>
  <text x="58" y="36.4" font-family="Inter,system-ui,Arial,sans-serif" font-size="7" font-weight="700" fill="#f3f4f8">OpenRomeo Video Studio</text>
  <rect x="270" y="27" width="34" height="12" rx="6" fill="#1c1c26"/>
  <text x="287" y="35.4" font-family="Inter,system-ui,Arial,sans-serif" font-size="5.6" fill="#ffb27a" text-anchor="middle">10s klip</text>
  <circle cx="318" cy="33" r="5.5" fill="#7c3aed"/>
  <text x="318" y="35.2" font-family="Inter,system-ui,Arial,sans-serif" font-size="5" font-weight="700" fill="#fff" text-anchor="middle">RN</text>
  <g font-family="Inter,system-ui,Arial,sans-serif" font-size="5.2" font-weight="700" text-anchor="middle">
    <circle cx="334" cy="33" r="4" fill="#ff7a18"/><text x="334" y="35" fill="#0b0b10">1</text>
    <circle cx="343" cy="33" r="4" fill="#ff7a18"/><text x="343" y="35" fill="#0b0b10">2</text>
    <circle cx="352" cy="33" r="4" fill="none" stroke="#3a3a4a" stroke-width="1"/><text x="352" y="35" fill="#8b8b9a">3</text>
    <circle cx="361" cy="33" r="4" fill="none" stroke="#3a3a4a" stroke-width="1"/><text x="361" y="35" fill="#8b8b9a">4</text>
  </g>

  <!-- left: composer -->
  <rect x="40" y="52" width="132" height="150" rx="6" fill="#111118" stroke="#22222e" stroke-width="0.8"/>
  <g font-family="Inter,system-ui,Arial,sans-serif" font-size="5.4" font-weight="600">
    <rect x="46" y="58" width="58" height="12" rx="6" fill="url(#ovacc)"/><text x="75" y="66.2" fill="#fff" text-anchor="middle">Text &#8594; Video</text>
    <rect x="107" y="58" width="60" height="12" rx="6" fill="#1c1c26"/><text x="137" y="66.2" fill="#9a9aab" text-anchor="middle">Image &#8594; Video</text>
  </g>
  <rect x="46" y="75" width="120" height="40" rx="5" fill="#0b0b10" stroke="#2a2a38" stroke-width="0.8"/>
  <text x="51" y="84" font-family="Inter,system-ui,Arial,sans-serif" font-size="5.2" fill="#f3f4f8">Neon city drive, kamera dolly</text>
  <text x="51" y="91.5" font-family="Inter,system-ui,Arial,sans-serif" font-size="5.2" fill="#f3f4f8">perlahan ke depan, cahaya kota</text>
  <text x="51" y="99" font-family="Inter,system-ui,Arial,sans-serif" font-size="5.2" fill="#f3f4f8">memantul di jalan basah&#8230;</text>
  <text x="51" y="109" font-family="Inter,system-ui,Arial,sans-serif" font-size="4.6" fill="#ffb27a">&#10024; arahan dipertajam otomatis</text>
  <g font-family="Inter,system-ui,Arial,sans-serif" font-size="4.8">
    <text x="46" y="126" fill="#8b8b9a">RASIO</text>
    <rect x="46" y="129" width="18" height="10" rx="3" fill="#ff7a18"/><text x="55" y="136" fill="#0b0b10" font-weight="700" text-anchor="middle">16:9</text>
    <rect x="66" y="129" width="18" height="10" rx="3" fill="#1c1c26"/><text x="75" y="136" fill="#9a9aab" text-anchor="middle">9:16</text>
    <rect x="86" y="129" width="16" height="10" rx="3" fill="#1c1c26"/><text x="94" y="136" fill="#9a9aab" text-anchor="middle">1:1</text>
    <rect x="104" y="129" width="16" height="10" rx="3" fill="#1c1c26"/><text x="112" y="136" fill="#9a9aab" text-anchor="middle">4:3</text>
    <rect x="122" y="129" width="16" height="10" rx="3" fill="#1c1c26"/><text x="130" y="136" fill="#9a9aab" text-anchor="middle">3:4</text>
    <rect x="140" y="129" width="20" height="10" rx="3" fill="#1c1c26"/><text x="150" y="136" fill="#9a9aab" text-anchor="middle">21:9</text>
    <text x="46" y="151" fill="#8b8b9a">RESOLUSI</text>
    <rect x="46" y="154" width="24" height="10" rx="3" fill="#1c1c26"/><text x="58" y="161" fill="#9a9aab" text-anchor="middle">720p</text>
    <rect x="72" y="154" width="26" height="10" rx="3" fill="#7c3aed"/><text x="85" y="161" fill="#fff" font-weight="700" text-anchor="middle">1080p</text>
    <rect x="104" y="154" width="8" height="8" rx="2" fill="#06b6d4"/><text x="116" y="161" fill="#9a9aab">Audio</text>
  </g>
  <rect x="46" y="172" width="120" height="16" rx="8" fill="url(#ovacc)"/>
  <text x="106" y="182.5" font-family="Inter,system-ui,Arial,sans-serif" font-size="6.2" font-weight="700" fill="#fff" text-anchor="middle">Generate video</text>
  <text x="46" y="197" font-family="Inter,system-ui,Arial,sans-serif" font-size="4.6" fill="#8b8b9a">kuota 2 / 4 &#183; akun Google</text>

  <!-- right: cinematic frame + job card -->
  <rect x="180" y="52" width="180" height="102" rx="6" fill="url(#ovframe)"/>
  <!-- neon city: road + lights -->
  <path d="M200 154 L262 88 L278 88 L340 154 Z" fill="url(#ovroad)"/>
  <path d="M270 88 L270 154" stroke="#f3f4f8" stroke-width="0.8" stroke-dasharray="5 5" opacity=".6"/>
  <g fill="#ff7a18" opacity=".85">
    <rect x="196" y="98" width="6" height="30" rx="1"/><rect x="206" y="104" width="5" height="24" rx="1"/><rect x="330" y="96" width="7" height="32" rx="1"/><rect x="320" y="106" width="5" height="22" rx="1"/>
  </g>
  <g fill="#f472b6" opacity=".8">
    <rect x="214" y="110" width="4" height="18" rx="1"/><rect x="314" y="112" width="4" height="16" rx="1"/>
  </g>
  <g fill="#06b6d4" opacity=".7">
    <rect x="222" y="114" width="3" height="14" rx="1"/><rect x="308" y="115" width="3" height="13" rx="1"/>
  </g>
  <rect x="186" y="58" width="42" height="11" rx="5.5" fill="rgba(0,0,0,.55)"/>
  <circle cx="193" cy="63.5" r="2.4" fill="#ff6b7a"/>
  <text x="199" y="65.6" font-family="Inter,system-ui,Arial,sans-serif" font-size="5" fill="#f3f4f8">00:07 / 00:10</text>
  <rect x="312" y="58" width="42" height="11" rx="5.5" fill="rgba(0,0,0,.55)"/>
  <text x="333" y="65.6" font-family="Inter,system-ui,Arial,sans-serif" font-size="5" fill="#f3f4f8" text-anchor="middle">1080p &#183; 16:9</text>
  <!-- progress -->
  <rect x="186" y="143" width="168" height="4" rx="2" fill="rgba(255,255,255,.18)"/>
  <rect x="186" y="143" width="118" height="4" rx="2" fill="url(#ovacc)"/>

  <!-- job card -->
  <rect x="180" y="160" width="180" height="42" rx="6" fill="#111118" stroke="#22222e" stroke-width="0.8"/>
  <text x="186" y="170" font-family="Inter,system-ui,Arial,sans-serif" font-size="5.2" font-weight="700" fill="#f3f4f8">Job diantre &#183; polling tiap 20 dtk</text>
  <g font-family="Inter,system-ui,Arial,sans-serif" font-size="4.8" text-anchor="middle">
    <rect x="186" y="175" width="38" height="10" rx="5" fill="#1c1c26"/><text x="205" y="182" fill="#9a9aab">pending</text>
    <rect x="227" y="175" width="44" height="10" rx="5" fill="#7c3aed"/><text x="249" y="182" fill="#fff">processing</text>
    <rect x="274" y="175" width="44" height="10" rx="5" fill="#1c1c26"/><text x="296" y="182" fill="#9a9aab">completed</text>
    <rect x="321" y="175" width="33" height="10" rx="5" fill="#1c1c26"/><text x="337.5" y="182" fill="#9a9aab">MP4</text>
  </g>
  <text x="186" y="196" font-family="Inter,system-ui,Arial,sans-serif" font-size="4.6" fill="#8b8b9a">job tersimpan di browser &#183; lanjut setelah reload &#183; gagal = kuota kembali</text>

  <!-- footer strip -->
  <rect x="40" y="208" width="320" height="20" rx="6" fill="#111118" stroke="#22222e" stroke-width="0.8"/>
  <text x="48" y="220.5" font-family="Inter,system-ui,Arial,sans-serif" font-size="5.2" fill="#9a9aab">Google sign-in tanpa cookie &#183; arahan dipertajam LLM &#183; presigned MP4 + fallback proxy &#183; HTML statis + 3 fungsi</text>

  <!-- caption -->
  <text x="200" y="262" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#f3f4f8" text-anchor="middle">OpenRomeo Video Studio</text>
  <text x="200" y="281" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#ffb27a" text-anchor="middle">Teks atau gambar &#183; klip sinematik 10 detik</text>
</svg>
