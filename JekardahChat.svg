  <!-- caption -->
  <g font-family="-apple-system,Inter,Helvetica Neue,Arial,sans-serif" text-anchor="middle">
    <text x="200" y="272" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.6">JEKARDAH CHAT</text>
    <text x="200" y="286" font-size="6.4" fill="#cfe1f7">Chat dengan email Gmail &#183; Web &#183; iPhone &#183; Android &#183; Mac &#183; Windows</text>
  </g>
</svg>
