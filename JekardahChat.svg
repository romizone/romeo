<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="jcbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16295a"/>
      <stop offset="100%" style="stop-color:#2556BC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#jcbg)" rx="16"/>

  <!-- window -->
  <rect x="24" y="20" width="352" height="232" rx="10" fill="#ffffff"/>

  <!-- left rail -->
  <path d="M34 20 h12 v232 h-12 a10 10 0 0 1 -10 -10 v-212 a10 10 0 0 1 10 -10 z" fill="#E7F1F9"/>
  <rect x="30" y="34" width="12" height="12" rx="3" fill="#2556BC"/>
  <path d="M33 38 h6 v3.4 h-4 l-2 1.6 z" fill="#ffffff"/>
  <circle cx="36" cy="238" r="5" fill="#85C3E5"/>

  <!-- chat list -->
  <rect x="46" y="20" width="110" height="232" fill="#ffffff"/>
  <line x1="156" y1="20" x2="156" y2="252" stroke="#d9e3ee" stroke-width="0.8"/>
  <g font-family="-apple-system,Inter,Helvetica Neue,Arial,sans-serif">
    <text x="54" y="38" font-size="10" font-weight="700" fill="#1b2433">Chat</text>
    <rect x="54" y="46" width="94" height="11" rx="5.5" fill="#E7F1F9"/>
    <text x="61" y="53.6" font-size="5" fill="#515151">Cari atau mulai chat baru</text>
    <rect x="54" y="61" width="20" height="8" rx="4" fill="#2556BC"/><text x="64" y="66.6" font-size="4.6" fill="#fff" text-anchor="middle">Semua</text>
    <rect x="77" y="61" width="34" height="8" rx="4" fill="#E7F1F9"/><text x="94" y="66.6" font-size="4.6" fill="#515151" text-anchor="middle">Belum dibaca</text>

    <!-- row 1 (active) -->
    <rect x="47" y="74" width="108" height="26" fill="#E7F1F9"/>
    <circle cx="62" cy="87" r="8" fill="#467DDB"/><text x="62" y="89.6" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">B</text>
    <text x="74" y="84" font-size="5.8" font-weight="700" fill="#1b2433">budisantoso@gmail</text>
    <text x="74" y="93" font-size="4.8" fill="#2556BC">mengetik&#8230;</text>
    <text x="150" y="84" font-size="4.2" fill="#515151" text-anchor="end">09.41</text>

    <!-- row 2 -->
    <circle cx="62" cy="113" r="8" fill="#85C3E5"/><text x="62" y="115.6" font-size="7" font-weight="700" fill="#16295a" text-anchor="middle">T</text>
    <text x="74" y="110" font-size="5.8" font-weight="700" fill="#1b2433">Tim Jekardah</text>
    <text x="74" y="119" font-size="4.8" fill="#515151">Sari: rapat jam 2 ya</text>
    <text x="150" y="110" font-size="4.2" fill="#2556BC" text-anchor="end">09.30</text>
    <circle cx="146" cy="117.5" r="3.6" fill="#2556BC"/><text x="146" y="119.2" font-size="4.4" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <line x1="74" y1="126" x2="155" y2="126" stroke="#eef2f7" stroke-width="0.6"/>

    <!-- row 3 -->
    <circle cx="62" cy="139" r="8" fill="#c9d8ef"/><text x="62" y="141.6" font-size="7" font-weight="700" fill="#2556BC" text-anchor="middle">A</text>
    <text x="74" y="136" font-size="5.8" font-weight="700" fill="#1b2433">ayu.lestari@gmail</text>
    <text x="74" y="145" font-size="4.8" fill="#515151">&#128196; Laporan.pdf</text>
    <text x="150" y="136" font-size="4.2" fill="#515151" text-anchor="end">Kemarin</text>
    <line x1="74" y1="152" x2="155" y2="152" stroke="#eef2f7" stroke-width="0.6"/>

    <!-- row 4 -->
    <circle cx="62" cy="165" r="8" fill="#dbe7f5"/><text x="62" y="167.6" font-size="7" font-weight="700" fill="#467DDB" text-anchor="middle">R</text>
    <text x="74" y="162" font-size="5.8" font-weight="700" fill="#1b2433">rina@gmail.com</text>
    <text x="74" y="171" font-size="4.8" fill="#515151">Undangan terkirim</text>

    <!-- daily purge note -->
    <rect x="52" y="226" width="98" height="18" rx="4" fill="#E7F1F9"/>
    <path d="M59.6 233 v-1.8 a2.4 2.4 0 0 1 4.8 0 v1.8" fill="none" stroke="#2556BC" stroke-width="0.9"/>
    <rect x="58.2" y="233" width="7.6" height="5.8" rx="1" fill="#2556BC"/>
    <text x="70" y="233.4" font-size="4.4" font-weight="700" fill="#2556BC">Dihapus otomatis</text>
    <text x="70" y="239.4" font-size="4.2" fill="#515151">setiap hari 00.00 WIB</text>
  </g>

  <!-- conversation pane -->
  <path d="M156 20 h210 a10 10 0 0 1 10 10 v212 a10 10 0 0 1 -10 10 h-210 z" fill="#f2f6fb"/>
  <path d="M156 20 h210 a10 10 0 0 1 10 10 v14 h-220 z" fill="#ffffff"/>
  <line x1="156" y1="44" x2="376" y2="44" stroke="#d9e3ee" stroke-width="0.8"/>
  <g font-family="-apple-system,Inter,Helvetica Neue,Arial,sans-serif">
    <circle cx="170" cy="32" r="7" fill="#467DDB"/><text x="170" y="34.4" font-size="6.4" font-weight="700" fill="#fff" text-anchor="middle">B</text>
    <text x="182" y="30.4" font-size="6.2" font-weight="700" fill="#1b2433">budisantoso@gmail.com</text>
    <text x="182" y="38.4" font-size="4.6" fill="#2556BC">online</text>

    <!-- day chip -->
    <rect x="248" y="52" width="36" height="9" rx="4.5" fill="#ffffff"/>
    <text x="266" y="58" font-size="4.6" fill="#515151" text-anchor="middle">HARI INI</text>

    <!-- incoming -->
    <rect x="166" y="68" width="112" height="22" rx="6" fill="#ffffff"/>
    <text x="173" y="78" font-size="5.6" fill="#1b2433">Halo! Sudah pakai Jekardah Chat?</text>
    <text x="173" y="85.6" font-size="5.6" fill="#1b2433">Cukup ketik email Gmail-ku.</text>
    <text x="272" y="86" font-size="3.8" fill="#515151" text-anchor="end">09.38</text>

    <!-- outgoing with quote -->
    <rect x="236" y="96" width="130" height="36" rx="6" fill="#d6e6fb"/>
    <rect x="241" y="100" width="120" height="13" rx="3" fill="#c3d9f6"/>
    <rect x="241" y="100" width="2" height="13" fill="#2556BC"/>
    <text x="246" y="105.6" font-size="4.4" font-weight="700" fill="#2556BC">budisantoso</text>
    <text x="246" y="110.8" font-size="4.4" fill="#515151">Cukup ketik email Gmail-ku.</text>
    <text x="242" y="122" font-size="5.6" fill="#1b2433">Iya, tanpa nomor HP sama sekali &#128077;</text>
    <text x="350" y="128.6" font-size="3.8" fill="#515151" text-anchor="end">09.40</text>
    <path d="M352.5 126.6 l1.4 1.4 l2.8 -3 M355.2 126.6 l1.4 1.4 l2.8 -3" fill="none" stroke="#2556BC" stroke-width="0.8"/>

    <!-- incoming photo -->
    <rect x="166" y="138" width="78" height="56" rx="6" fill="#ffffff"/>
    <rect x="170" y="142" width="70" height="42" rx="4" fill="#85C3E5"/>
    <path d="M170 176 l18 -16 l14 11 l10 -7 l28 18 v2 a4 4 0 0 1 -4 4 h-62 a4 4 0 0 1 -4 -4 z" fill="#467DDB"/>
    <circle cx="226" cy="152" r="5" fill="#E7F1F9"/>
    <text x="238" y="190.6" font-size="3.8" fill="#515151" text-anchor="end">09.41</text>

    <!-- sticker -->
    <g transform="translate(316 152)">
      <circle cx="18" cy="18" r="18" fill="#2556BC"/>
      <circle cx="12" cy="15" r="3" fill="#fff"/><circle cx="24" cy="15" r="3" fill="#fff"/>
      <circle cx="12.6" cy="15.4" r="1.4" fill="#16295a"/><circle cx="24.6" cy="15.4" r="1.4" fill="#16295a"/>
      <path d="M10 23 q8 7 16 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- typing -->
    <rect x="166" y="200" width="30" height="13" rx="6.5" fill="#ffffff"/>
    <circle cx="175" cy="206.5" r="1.8" fill="#85C3E5"/><circle cx="181" cy="206.5" r="1.8" fill="#467DDB"/><circle cx="187" cy="206.5" r="1.8" fill="#2556BC"/>

    <!-- composer -->
    <rect x="156" y="226" width="220" height="26" fill="#ffffff"/>
    <path d="M156 226 h220 v16 a10 10 0 0 1 -10 10 h-210 z" fill="#ffffff"/>
    <text x="166" y="242" font-size="9" fill="#467DDB">+</text>
    <text x="178" y="242" font-size="7.4" fill="#467DDB">&#9786;</text>
    <rect x="192" y="232" width="150" height="14" rx="7" fill="#f2f6fb"/>
    <text x="199" y="240.8" font-size="5" fill="#515151">Ketik pesan</text>
    <circle cx="356" cy="239" r="8" fill="#2556BC"/>
    <path d="M352.5 235.5 l8 3.5 l-8 3.5 l1.2 -3.5 z" fill="#ffffff"/>
