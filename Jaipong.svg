<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>

  <!-- studio window -->
  <rect x="40" y="26" width="320" height="206" rx="10" fill="#111827" stroke="url(#accent)" stroke-width="2"/>
  <rect x="40" y="26" width="320" height="24" rx="10" fill="#1f2937"/>
  <rect x="40" y="40" width="320" height="10" fill="#1f2937"/>
  <circle cx="56" cy="38" r="4" fill="#ef4444"/>
  <circle cx="70" cy="38" r="4" fill="#f59e0b"/>
  <circle cx="84" cy="38" r="4" fill="#22c55e"/>
  <rect x="100" y="32" width="140" height="12" rx="6" fill="#0b1220"/>
  <text x="170" y="41" font-family="system-ui,Arial,sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">jaipong.rominur.com</text>

  <!-- left: prompt box and genre chips -->
  <rect x="52" y="60" width="140" height="44" rx="6" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <text x="60" y="74" font-family="system-ui,Arial,sans-serif" font-size="8" fill="#94a3b8">Lagu tentang hujan</text>
  <text x="60" y="86" font-family="system-ui,Arial,sans-serif" font-size="8" fill="#94a3b8">sore di Bandung&#8230;</text>
  <rect x="60" y="93" width="1.4" height="8" fill="#f59e0b"/>
  <g font-family="system-ui,Arial,sans-serif" font-size="7">
    <rect x="52" y="112" width="64" height="14" rx="7" fill="url(#accent)"/>
    <text x="84" y="121.5" fill="#0f172a" text-anchor="middle" font-weight="700">Jaipong Sunda</text>
    <rect x="120" y="112" width="46" height="14" rx="7" fill="#0b1220" stroke="#334155" stroke-width="1"/>
    <text x="143" y="121.5" fill="#64748b" text-anchor="middle">Dangdut</text>
    <rect x="52" y="131" width="52" height="14" rx="7" fill="#0b1220" stroke="#334155" stroke-width="1"/>
    <text x="78" y="140.5" fill="#64748b" text-anchor="middle">Keroncong</text>
    <rect x="108" y="131" width="48" height="14" rx="7" fill="#0b1220" stroke="#334155" stroke-width="1"/>
    <text x="132" y="140.5" fill="#64748b" text-anchor="middle">Gamelan</text>
  </g>
  <!-- buat lagu button -->
  <rect x="52" y="154" width="140" height="18" rx="9" fill="url(#accent)"/>
  <text x="122" y="166" font-family="system-ui,Arial,sans-serif" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">&#9835; Buat Lagu</text>

  <!-- right: karaoke lyric panel, three tiers -->
  <rect x="204" y="60" width="144" height="112" rx="6" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <g fill="#334155">
    <rect x="216" y="74" width="96" height="6" rx="3"/>
    <rect x="216" y="88" width="108" height="6" rx="3"/>
  </g>
  <!-- active line, glowing -->
  <rect x="212" y="102" width="128" height="16" rx="4" fill="#1f2937" stroke="url(#accent)" stroke-width="1.4"/>
  <rect x="218" y="108" width="102" height="5" rx="2.5" fill="#f59e0b"/>
  <g fill="#334155">
    <rect x="216" y="128" width="100" height="6" rx="3"/>
    <rect x="216" y="142" width="88" height="6" rx="3"/>
    <rect x="216" y="156" width="104" height="6" rx="3"/>
  </g>

  <!-- player bar with waveform -->
  <rect x="52" y="182" width="296" height="38" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <circle cx="74" cy="201" r="11" fill="url(#accent)"/>
  <path d="M70 195 L82 201 L70 207 Z" fill="#0f172a"/>
  <!-- visualizer bars -->
  <g fill="url(#accent)">
    <rect x="96" y="196" width="4" height="10" rx="2"/>
    <rect x="104" y="191" width="4" height="20" rx="2"/>
    <rect x="112" y="198" width="4" height="7" rx="2"/>
    <rect x="120" y="188" width="4" height="26" rx="2"/>
    <rect x="128" y="194" width="4" height="14" rx="2"/>
    <rect x="136" y="190" width="4" height="22" rx="2"/>
    <rect x="144" y="197" width="4" height="9" rx="2"/>
    <rect x="152" y="192" width="4" height="18" rx="2"/>
    <rect x="160" y="195" width="4" height="12" rx="2"/>
  </g>
  <!-- progress line -->
  <rect x="176" y="199" width="132" height="4" rx="2" fill="#1f2937"/>
  <rect x="176" y="199" width="54" height="4" rx="2" fill="url(#accent)"/>
  <circle cx="230" cy="201" r="4" fill="#f8fafc"/>
  <!-- download -->
  <path d="M326 193 L326 205 M320 200 L326 206 L332 200 M319 210 L333 210" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- caption -->
  <text x="200" y="260" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">Jaipong</text>
  <text x="200" y="280" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Studio lagu AI &#183; satu kalimat jadi lagu utuh</text>
</svg>
