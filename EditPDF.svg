<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e11d48"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>

  <!-- browser window -->
  <rect x="34" y="26" width="332" height="210" rx="10" fill="#111827" stroke="url(#accent)" stroke-width="2"/>
  <rect x="34" y="26" width="332" height="24" rx="10" fill="#1f2937"/>
  <rect x="34" y="40" width="332" height="10" fill="#1f2937"/>
  <circle cx="50" cy="38" r="4" fill="#ef4444"/>
  <circle cx="64" cy="38" r="4" fill="#f59e0b"/>
  <circle cx="78" cy="38" r="4" fill="#22c55e"/>
  <rect x="96" y="32" width="120" height="12" rx="6" fill="#0b1220"/>
  <text x="156" y="41" font-family="system-ui,Arial,sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">pdf.rominur.com</text>

  <!-- left tool rail -->
  <rect x="44" y="60" width="62" height="166" rx="6" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  <g fill="#334155">
    <rect x="52" y="70" width="46" height="7" rx="3.5"/>
    <rect x="52" y="84" width="38" height="7" rx="3.5"/>
    <rect x="52" y="98" width="42" height="7" rx="3.5"/>
    <rect x="52" y="126" width="40" height="7" rx="3.5"/>
    <rect x="52" y="140" width="44" height="7" rx="3.5"/>
    <rect x="52" y="154" width="36" height="7" rx="3.5"/>
    <rect x="52" y="182" width="43" height="7" rx="3.5"/>
    <rect x="52" y="196" width="37" height="7" rx="3.5"/>
  </g>
  <rect x="52" y="112" width="46" height="8" rx="4" fill="url(#accent)"/>

  <!-- page canvas -->
  <rect x="118" y="60" width="150" height="166" rx="4" fill="#f8fafc"/>
  <g fill="#cbd5e1">
    <rect x="130" y="74" width="104" height="6" rx="3"/>
    <rect x="130" y="88" width="126" height="5" rx="2.5"/>
    <rect x="130" y="99" width="118" height="5" rx="2.5"/>
    <rect x="130" y="140" width="122" height="5" rx="2.5"/>
    <rect x="130" y="151" width="96" height="5" rx="2.5"/>
    <rect x="130" y="186" width="110" height="5" rx="2.5"/>
    <rect x="130" y="197" width="80" height="5" rx="2.5"/>
  </g>
  <!-- in-place text edit box -->
  <rect x="126" y="112" width="134" height="20" rx="3" fill="#fff" stroke="#e11d48" stroke-width="1.6"/>
  <rect x="132" y="119" width="86" height="6" rx="3" fill="#334155"/>
  <rect x="222" y="115" width="1.6" height="14" fill="#e11d48"/>
  <g fill="#e11d48">
    <circle cx="126" cy="112" r="2.6"/><circle cx="260" cy="112" r="2.6"/>
    <circle cx="126" cy="132" r="2.6"/><circle cx="260" cy="132" r="2.6"/>
  </g>
  <!-- whiteout patch -->
  <rect x="130" y="165" width="60" height="12" rx="2" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- right thumbnails -->
  <g>
    <rect x="280" y="60" width="76" height="48" rx="4" fill="#0b1220" stroke="url(#accent)" stroke-width="1.4"/>
    <rect x="280" y="118" width="76" height="48" rx="4" fill="#0b1220" stroke="#334155" stroke-width="1"/>
    <rect x="280" y="176" width="76" height="48" rx="4" fill="#0b1220" stroke="#334155" stroke-width="1"/>
  </g>
  <g fill="#334155">
    <rect x="288" y="70" width="52" height="4" rx="2"/><rect x="288" y="78" width="44" height="4" rx="2"/>
    <rect x="288" y="128" width="52" height="4" rx="2"/><rect x="288" y="136" width="40" height="4" rx="2"/>
    <rect x="288" y="186" width="48" height="4" rx="2"/><rect x="288" y="194" width="52" height="4" rx="2"/>
  </g>

  <!-- caption -->
  <text x="200" y="262" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="middle">EditPDF</text>
  <text x="200" y="281" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">41 PDF tools &#183; 100% in the browser</text>
</svg>
