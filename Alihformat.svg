<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="afbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#151b22"/>
      <stop offset="100%" style="stop-color:#1f2a33"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#afbg)" rx="16"/>

  <!-- window -->
  <rect x="28" y="20" width="344" height="226" rx="10" fill="#edf0f2"/>
  <rect x="28" y="20" width="344" height="24" rx="10" fill="#edf0f2"/>
  <line x1="28" y1="44" x2="372" y2="44" stroke="#cbd2d9" stroke-width="0.8"/>
  <!-- logo: a page with a folded corner -->
  <path d="M38 27 h6.5 l3.5 3.5 v8.5 h-10 z" fill="#151b22"/>
  <text x="52" y="35.8" font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#151b22">Alihformat</text>
  <text x="362" y="35.4" font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-size="5.4" fill="#56606c" text-anchor="end">Semua alat</text>

  <!-- hero -->
  <g font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-weight="800" fill="#151b22" letter-spacing="-0.4">
    <text x="40" y="66" font-size="15">Ubah format file</text>
    <text x="40" y="82" font-size="15">tanpa mengunggahnya.</text>
  </g>
  <text x="40" y="93" font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-size="5.2" fill="#56606c">JPG ke PDF, RAR ke ZIP, XLSX ke CSV, MP4 ke MP3, dan 76 alat lainnya.</text>

  <!-- where-it-runs legend -->
  <g font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-size="4.8" font-weight="600">
    <rect x="252" y="55" width="108" height="11" rx="5.5" fill="#ffffff" stroke="#0d6b55" stroke-opacity=".45" stroke-width="0.7"/>
    <circle cx="259" cy="60.5" r="2" fill="#0d6b55"/>
    <text x="264" y="62.2" fill="#0d6b55">Diproses di perangkatmu</text>
    <rect x="252" y="70" width="108" height="11" rx="5.5" fill="#ffffff" stroke="#8a5200" stroke-opacity=".45" stroke-width="0.7"/>
    <circle cx="259" cy="75.5" r="2" fill="#8a5200"/>
    <text x="264" y="77.2" fill="#8a5200">AI lewat OpenRouter, maks 3 MB</text>
  </g>

  <!-- category chips -->
  <g font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-size="5" font-weight="500">
    <rect x="40" y="99" width="24" height="10" rx="5" fill="#151b22"/><text x="52" y="105.8" fill="#fff" text-anchor="middle">Semua</text>
    <rect x="67" y="99" width="26" height="10" rx="5" fill="#fff" stroke="#cbd2d9" stroke-width="0.7"/><text x="80" y="105.8" fill="#151b22" text-anchor="middle">Gambar</text>
    <rect x="96" y="99" width="16" height="10" rx="5" fill="#fff" stroke="#cbd2d9" stroke-width="0.7"/><text x="104" y="105.8" fill="#151b22" text-anchor="middle">PDF</text>
    <rect x="115" y="99" width="20" height="10" rx="5" fill="#fff" stroke="#cbd2d9" stroke-width="0.7"/><text x="125" y="105.8" fill="#151b22" text-anchor="middle">Arsip</text>
    <rect x="138" y="99" width="50" height="10" rx="5" fill="#fff" stroke="#cbd2d9" stroke-width="0.7"/><text x="163" y="105.8" fill="#151b22" text-anchor="middle">Spreadsheet &amp; data</text>
    <rect x="191" y="99" width="30" height="10" rx="5" fill="#fff" stroke="#cbd2d9" stroke-width="0.7"/><text x="206" y="105.8" fill="#151b22" text-anchor="middle">Dokumen</text>
    <rect x="224" y="99" width="38" height="10" rx="5" fill="#fff" stroke="#cbd2d9" stroke-width="0.7"/><text x="243" y="105.8" fill="#151b22" text-anchor="middle">Audio &amp; video</text>
    <rect x="265" y="99" width="34" height="10" rx="5" fill="#fff" stroke="#cbd2d9" stroke-width="0.7"/><text x="282" y="105.8" fill="#151b22" text-anchor="middle">Dengan AI</text>
  </g>

  <!-- format-pair rows: tag = a small page with a clipped corner -->
  <g font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-size="6.2" font-weight="800" fill="#151b22">
    <!-- column 1 -->
    <path d="M40 119 h17 l3 3 v8 h-20 z" fill="#f6d5cf"/><text x="42.5" y="127.2">JPG</text>
    <text x="64" y="127" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M72 119 h17 l3 3 v8 h-20 z" fill="#f6d5cf"/><text x="74.5" y="127.2">PDF</text>
    <line x1="40" y1="136" x2="140" y2="136" stroke="#cbd2d9" stroke-width="0.6"/>

    <path d="M40 142 h17 l3 3 v8 h-20 z" fill="#ddd6f3"/><text x="42.5" y="150.2">RAR</text>
    <text x="64" y="150" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M72 142 h17 l3 3 v8 h-20 z" fill="#ddd6f3"/><text x="74.5" y="150.2">ZIP</text>
    <line x1="40" y1="159" x2="140" y2="159" stroke="#cbd2d9" stroke-width="0.6"/>

    <path d="M40 165 h21 l3 3 v8 h-24 z" fill="#cdebdd"/><text x="42.5" y="173.2">HEIC</text>
    <text x="68" y="173" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M76 165 h17 l3 3 v8 h-20 z" fill="#cdebdd"/><text x="78.5" y="173.2">JPG</text>
    <line x1="40" y1="182" x2="140" y2="182" stroke="#cbd2d9" stroke-width="0.6"/>

    <!-- column 2 -->
    <path d="M152 119 h21 l3 3 v8 h-24 z" fill="#d2e4f5"/><text x="154.5" y="127.2">XLSX</text>
    <text x="180" y="127" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M188 119 h17 l3 3 v8 h-20 z" fill="#d2e4f5"/><text x="190.5" y="127.2">CSV</text>
    <line x1="152" y1="136" x2="252" y2="136" stroke="#cbd2d9" stroke-width="0.6"/>

    <path d="M152 142 h17 l3 3 v8 h-20 z" fill="#f3d3e6"/><text x="154.5" y="150.2">MP4</text>
    <text x="176" y="150" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M184 142 h17 l3 3 v8 h-20 z" fill="#f3d3e6"/><text x="186.5" y="150.2">MP3</text>
    <line x1="152" y1="159" x2="252" y2="159" stroke="#cbd2d9" stroke-width="0.6"/>

    <path d="M152 165 h21 l3 3 v8 h-24 z" fill="#ede4c8"/><text x="154.5" y="173.2">DOCX</text>
    <text x="180" y="173" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M188 165 h15 l3 3 v8 h-18 z" fill="#ede4c8"/><text x="190.5" y="173.2">MD</text>
    <line x1="152" y1="182" x2="252" y2="182" stroke="#cbd2d9" stroke-width="0.6"/>

    <!-- column 3: AI -->
    <path d="M264 119 h17 l3 3 v8 h-20 z" fill="#fbe3b1"/><text x="266.5" y="127.2">PDF</text>
    <text x="288" y="127" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M296 119 h38 l3 3 v8 h-41 z" fill="#fbe3b1"/><text x="298.5" y="127.2">Markdown</text>
    <text x="360" y="127" font-size="4.4" font-weight="700" fill="#8a5200" text-anchor="end">AI</text>
    <line x1="264" y1="136" x2="362" y2="136" stroke="#cbd2d9" stroke-width="0.6"/>

    <path d="M264 142 h29 l3 3 v8 h-32 z" fill="#fbe3b1"/><text x="266.5" y="150.2">Invoice</text>
    <text x="300" y="150" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M308 142 h20 l3 3 v8 h-23 z" fill="#fbe3b1"/><text x="310.5" y="150.2">JSON</text>
    <text x="360" y="150" font-size="4.4" font-weight="700" fill="#8a5200" text-anchor="end">AI</text>
    <line x1="264" y1="159" x2="362" y2="159" stroke="#cbd2d9" stroke-width="0.6"/>

    <path d="M264 165 h17 l3 3 v8 h-20 z" fill="#ddd6f3"/><text x="266.5" y="173.2">ZIP</text>
    <text x="288" y="173" font-size="4.8" font-weight="400" fill="#56606c">ke</text>
    <path d="M296 165 h14 l3 3 v8 h-17 z" fill="#ddd6f3"/><text x="298.5" y="173.2">7Z</text>
    <line x1="264" y1="182" x2="362" y2="182" stroke="#cbd2d9" stroke-width="0.6"/>
  </g>

  <!-- a converter at work -->
  <rect x="40" y="190" width="322" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9" stroke-width="0.7"/>
  <g font-family="Archivo,Helvetica Neue,Arial,sans-serif">
    <text x="50" y="203" font-size="5.6" font-weight="700" fill="#151b22">liburan-bali.heic</text>
    <text x="352" y="203" font-size="5" fill="#56606c" text-anchor="end">3 dari 5 file</text>
    <rect x="50" y="208" width="302" height="4" rx="2" fill="#e3e8ec"/>
    <rect x="50" y="208" width="186" height="4" rx="2" fill="#0d6b55"/>
    <text x="50" y="224" font-size="4.8" fill="#0d6b55">&#9679; Tidak ke mana-mana: konversi dijalankan browser kamu.</text>
    <rect x="312" y="217" width="40" height="11" rx="3" fill="#151b22"/>
    <text x="332" y="224.3" font-size="5" font-weight="700" fill="#ffffff" text-anchor="middle">Unduh ZIP</text>
  </g>

  <!-- caption strip -->
  <text x="200" y="268" font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="800" fill="#edf0f2" text-anchor="middle" letter-spacing="0.2">80 konverter &#183; 76 di browser &#183; 4 dengan AI</text>
  <text x="200" y="283" font-family="Archivo,Helvetica Neue,Arial,sans-serif" font-size="6.2" fill="#98a2ae" text-anchor="middle">Canvas &#183; pdf-lib &#183; libarchive.js &#183; SheetJS &#183; ffmpeg.wasm &#183; OpenRouter</text>
</svg>
