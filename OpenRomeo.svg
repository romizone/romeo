<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Desktop window -->
  <rect x="70" y="32" width="260" height="130" rx="10" fill="#111827" stroke="url(#accent)" stroke-width="2"/>
  <rect x="70" y="32" width="260" height="24" rx="10" fill="#1f2937"/>
  <rect x="70" y="46" width="260" height="10" fill="#1f2937"/>
  <circle cx="86" cy="44" r="4" fill="#ef4444"/>
  <circle cx="100" cy="44" r="4" fill="#f59e0b"/>
  <circle cx="114" cy="44" r="4" fill="#22c55e"/>
  <!-- Agent avatar -->
  <circle cx="102" cy="86" r="13" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="97" cy="83" r="2.5" fill="#2563eb"/>
  <circle cx="107" cy="83" r="2.5" fill="#2563eb"/>
  <line x1="96" y1="92" x2="108" y2="92" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <!-- Conversation lines -->
  <rect x="124" y="76" width="140" height="7" rx="3.5" fill="#334155"/>
  <rect x="124" y="89" width="112" height="7" rx="3.5" fill="#334155"/>
  <rect x="124" y="102" width="88" height="7" rx="3.5" fill="#2563eb" opacity="0.55"/>
  <!-- Approval gate -->
  <rect x="90" y="122" width="76" height="22" rx="11" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="128" y="137" text-anchor="middle" fill="#22c55e" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" font-weight="600">Approve</text>
  <rect x="176" y="122" width="64" height="22" rx="11" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="208" y="137" text-anchor="middle" fill="#94a3b8" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" font-weight="600">Deny</text>
  <!-- Delivery arrows -->
  <line x1="120" y1="162" x2="120" y2="182" stroke="#2563eb" stroke-width="1.2" opacity="0.5"/>
  <line x1="173" y1="162" x2="173" y2="182" stroke="#2563eb" stroke-width="1.2" opacity="0.5"/>
  <line x1="227" y1="162" x2="227" y2="182" stroke="#8b5cf6" stroke-width="1.2" opacity="0.5"/>
  <line x1="280" y1="162" x2="280" y2="182" stroke="#8b5cf6" stroke-width="1.2" opacity="0.5"/>
  <!-- Deliverable files -->
  <rect x="94" y="182" width="52" height="34" rx="7" fill="#1e293b" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="204" text-anchor="middle" fill="#60a5fa" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="700">DOCX</text>
  <rect x="147" y="182" width="52" height="34" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="173" y="204" text-anchor="middle" fill="#fbbf24" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="700">PPTX</text>
  <rect x="201" y="182" width="52" height="34" rx="7" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="227" y="204" text-anchor="middle" fill="#4ade80" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="700">XLSX</text>
  <rect x="254" y="182" width="52" height="34" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="280" y="204" text-anchor="middle" fill="#a78bfa" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="700">PDF</text>
  <!-- Title -->
  <text x="200" y="252" text-anchor="middle" fill="#f8fafc" font-family="SF Pro Display, -apple-system, sans-serif" font-size="24" font-weight="700">OpenRomeo</text>
  <text x="200" y="274" text-anchor="middle" fill="#94a3b8" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11">AI Coworker That Delivers Finished Work</text>
</svg>
