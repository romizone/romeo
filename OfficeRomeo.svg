<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="orbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12233a"/>
      <stop offset="100%" style="stop-color:#1b2f47"/>
    </linearGradient>
    <linearGradient id="orco" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f6cbd"/>
      <stop offset="100%" style="stop-color:#5b5fc7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#orbg)" rx="16"/>

  <!-- app window -->
  <rect x="34" y="24" width="332" height="210" rx="9" fill="#f5f5f5" stroke="url(#orco)" stroke-width="2"/>

  <!-- fluent top bar -->
  <rect x="34" y="24" width="332" height="20" rx="9" fill="#ffffff"/>
  <rect x="34" y="36" width="332" height="8" fill="#ffffff"/>
  <rect x="35" y="43" width="330" height="1" fill="#e1dfdd"/>
  <g fill="#616161">
    <rect x="42" y="31" width="2.6" height="2.6" rx="0.6"/><rect x="46.4" y="31" width="2.6" height="2.6" rx="0.6"/><rect x="50.8" y="31" width="2.6" height="2.6" rx="0.6"/>
    <rect x="42" y="35" width="2.6" height="2.6" rx="0.6"/><rect x="46.4" y="35" width="2.6" height="2.6" rx="0.6"/><rect x="50.8" y="35" width="2.6" height="2.6" rx="0.6"/>
  </g>
  <text x="60" y="37" font-family="Segoe UI,system-ui,Arial,sans-serif" font-size="8" font-weight="600" fill="#242424">Office Romeo</text>
  <rect x="132" y="28" width="118" height="11" rx="3" fill="#f5f5f5"/>
  <text x="191" y="36" font-family="Segoe UI,system-ui,Arial,sans-serif" font-size="6" fill="#8a8886" text-anchor="middle">office.rominur.com</text>
  <circle cx="349" cy="34" r="6" fill="#c4314b"/>
  <text x="349" y="36.5" font-family="Segoe UI,system-ui,Arial,sans-serif" font-size="5.5" font-weight="700" fill="#fff" text-anchor="middle">OR</text>

  <!-- ribbon tabs -->
  <g font-family="Segoe UI,system-ui,Arial,sans-serif" font-size="6">
    <text x="44" y="54" fill="#185ABD" font-weight="700">Beranda</text>
    <text x="76" y="54" fill="#616161">Sisip</text>
    <text x="98" y="54" fill="#616161">Tata Letak</text>
    <text x="136" y="54" fill="#616161">Tinjau</text>
  </g>
  <rect x="42" y="56" width="30" height="1.6" fill="#185ABD"/>
  <rect x="35" y="61" width="330" height="1" fill="#e1dfdd"/>

  <!-- ribbon buttons -->
  <g fill="#ffffff" stroke="#e1dfdd" stroke-width="0.8">
    <rect x="42" y="66" width="16" height="13" rx="2"/>
    <rect x="61" y="66" width="16" height="13" rx="2"/>
    <rect x="80" y="66" width="16" height="13" rx="2"/>
  </g>
  <text x="50" y="75" font-family="Georgia,serif" font-size="8" font-weight="700" fill="#242424" text-anchor="middle">B</text>
  <text x="69" y="75" font-family="Georgia,serif" font-size="8" font-style="italic" fill="#242424" text-anchor="middle">I</text>
  <text x="88" y="75" font-family="Georgia,serif" font-size="8" fill="#242424" text-anchor="middle">U</text>

  <!-- document canvas -->
