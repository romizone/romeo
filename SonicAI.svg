<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="200" cy="140" r="120" fill="#8b5cf6" opacity="0.05"/>

  <!-- Frequency spectrum bars -->
  <g transform="translate(55, 195)">
    <rect x="0" y="-30" width="8" height="30" rx="2" fill="url(#barGrad)" opacity="0.7"/>
    <rect x="12" y="-55" width="8" height="55" rx="2" fill="url(#barGrad)" opacity="0.75"/>
    <rect x="24" y="-80" width="8" height="80" rx="2" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="36" y="-105" width="8" height="105" rx="2" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="48" y="-85" width="8" height="85" rx="2" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="60" y="-120" width="8" height="120" rx="2" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="72" y="-95" width="8" height="95" rx="2" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="84" y="-135" width="8" height="135" rx="2" fill="url(#barGrad)" opacity="0.95"/>
    <rect x="96" y="-110" width="8" height="110" rx="2" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="108" y="-145" width="8" height="145" rx="2" fill="url(#barGrad)" opacity="1"/>
    <rect x="120" y="-125" width="8" height="125" rx="2" fill="url(#barGrad)" opacity="0.95"/>
    <rect x="132" y="-150" width="8" height="150" rx="2" fill="url(#barGrad)" opacity="1"/>
    <rect x="144" y="-140" width="8" height="140" rx="2" fill="url(#barGrad)" opacity="0.95"/>
    <rect x="156" y="-120" width="8" height="120" rx="2" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="168" y="-155" width="8" height="155" rx="2" fill="url(#barGrad)" opacity="1"/>
    <rect x="180" y="-130" width="8" height="130" rx="2" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="192" y="-100" width="8" height="100" rx="2" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="204" y="-140" width="8" height="140" rx="2" fill="url(#barGrad)" opacity="0.95"/>
    <rect x="216" y="-90" width="8" height="90" rx="2" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="228" y="-115" width="8" height="115" rx="2" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="240" y="-75" width="8" height="75" rx="2" fill="url(#barGrad)" opacity="0.75"/>
    <rect x="252" y="-100" width="8" height="100" rx="2" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="264" y="-60" width="8" height="60" rx="2" fill="url(#barGrad)" opacity="0.7"/>
    <rect x="276" y="-45" width="8" height="45" rx="2" fill="url(#barGrad)" opacity="0.65"/>
  </g>

  <!-- Speaker icon -->
  <g transform="translate(15, 115)" opacity="0.2">
    <rect x="0" y="5" width="10" height="16" rx="1" fill="#8b5cf6"/>
    <polygon points="10,5 22,-5 22,31 10,21" fill="#8b5cf6"/>
    <path d="M27,2 Q37,13 27,24" stroke="#06b6d4" stroke-width="2" fill="none"/>
    <path d="M30,-3 Q45,13 30,29" stroke="#06b6d4" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Title -->
  <text x="200" y="240" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="white">SonicAI</text>
  <text x="200" y="262" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">AI Text-to-Song Generator</text>

  <!-- Genre pills -->
  <g transform="translate(85, 272)">
    <rect x="0" y="0" width="36" height="16" rx="8" fill="#8b5cf6" opacity="0.25"/>
    <text x="18" y="11" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#c4b5fd">Pop</text>
    <rect x="42" y="0" width="40" height="16" rx="8" fill="#06b6d4" opacity="0.25"/>
    <text x="62" y="11" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#67e8f9">Rock</text>
    <rect x="88" y="0" width="36" height="16" rx="8" fill="#ec4899" opacity="0.25"/>
    <text x="106" y="11" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#f9a8d4">Jazz</text>
    <rect x="130" y="0" width="52" height="16" rx="8" fill="#8b5cf6" opacity="0.25"/>
    <text x="156" y="11" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#c4b5fd">Electronic</text>
    <rect x="188" y="0" width="40" height="16" rx="8" fill="#06b6d4" opacity="0.25"/>
    <text x="208" y="11" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#67e8f9">Lo-fi</text>
  </g>
</svg>
